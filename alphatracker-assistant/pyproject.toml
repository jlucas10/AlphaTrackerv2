[project]
name = "alphatracker-assistant"
version = "0.1.0"
description = "AI trade review assistant for AlphaTracker: Gemini tool calling over the Spring analytics API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "tzdata",  # zoneinfo data for slim containers that ship without /usr/share/zoneinfo
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
